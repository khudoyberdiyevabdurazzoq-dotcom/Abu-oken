<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Band 9 Platform | Abdurazzoq</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
  background:radial-gradient(circle at top,#0b1220,#050814);
  color:white;
}

header{
  text-align:center;
  padding:50px 20px;
  background:linear-gradient(135deg,#0f172a,#1e3a8a);
  box-shadow:0 0 30px #38bdf8;
}

header h1{color:#38bdf8;font-size:42px;}
header p{color:#cbd5e1;margin-top:10px;}

.container{padding:50px 8%;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:25px;
}

.card{
  background:linear-gradient(145deg,#111827,#0b1220);
  padding:30px;
  border-radius:18px;
  cursor:pointer;
  transition:0.4s;
  border:1px solid #1f2937;
  text-align:center;
}

.card:hover{transform:translateY(-12px) scale(1.03);box-shadow:0 0 25px #38bdf8;}
.card h2{color:#38bdf8;font-size:26px;}

.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);justify-content:center;align-items:center;}

.box{
  background:#0f172a;
  width:92%;
  max-width:900px;
  padding:25px;
  border-radius:20px;
  max-height:90vh;
  overflow:auto;
  border:1px solid #38bdf8;
}

.close{float:right;cursor:pointer;color:red;font-size:24px;}

.item{background:#111827;padding:12px;margin:8px 0;border-radius:10px;border-left:3px solid #38bdf8;}
.word{color:#38bdf8;font-weight:bold;}
.article{background:#0b1220;padding:15px;border-radius:12px;border-left:3px solid #38bdf8;line-height:1.7;}
.telegram{margin-top:15px;display:block;text-align:center;color:#38bdf8;font-weight:bold;}
</style>
</head>

<body>

<header>
  <h1>IELTS Band 9 Master Platform</h1>
  <p>A1 → C2 | Education • Environment • Technology • Brain • English</p>
</header>

<div class="container">
<div class="grid">
<div class="card" onclick="openLevel('A1')"><h2>A1</h2><p>Beginner</p></div>
<div class="card" onclick="openLevel('A2')"><h2>A2</h2><p>Elementary</p></div>
<div class="card" onclick="openLevel('B1')"><h2>B1</h2><p>Intermediate</p></div>
<div class="card" onclick="openLevel('B2')"><h2>B2</h2><p>Upper Intermediate</p></div>
<div class="card" onclick="openLevel('C1')"><h2>C1</h2><p>Advanced</p></div>
<div class="card" onclick="openLevel('C2')"><h2>C2</h2><p>Mastery</p></div>
</div>
</div>

<div class="modal" id="modal">
<div class="box">
<span class="close" onclick="closeModal()">✖</span>
<h2 id="title"></h2>
<div id="content"></div>
<a class="telegram" href="https://t.me/a20100510" target="_blank">📩 Telegram IELTS Resources</a>
</div>
</div>

<script>

function vocab(level){
let base={
A1:[["book","kitob"],["school","maktab"],["water","suv"]],
A2:[["important","muhim"],["environment","atrof-muhit"],["study","o‘qish"]],
B1:[["technology","texnologiya"],["improve","yaxshilash"],["experience","tajriba"]],
B2:[["education","ta’lim"],["brain","miya"],["development","rivojlanish"]],
C1:[["sophisticated","murakkab"],["analysis","tahlil"],["innovation","yangilik"]],
C2:[["unprecedented","misli ko‘rilmagan"],["meticulous","juda aniq"],["cognition","kognitiv jarayon"]]
};
return base[level].map(w=>({w:w[0],t:w[1],e:"Example with "+w[0]}));
}

const data={
A1:{grammar:"To be, Present Simple basics",
article:"Education is important for children. Schools help students learn reading, writing and basic life skills. Environment also plays a role because clean air and water improve health. Technology is used in simple ways like phones and tablets. The human brain learns faster when information is repeated and practiced daily. English is an international language used all over the world. Learning English helps people communicate and understand different cultures."},
A2:{grammar:"Past Simple introduction",
article:"Education systems are changing due to technology. Online learning platforms allow students to study from home. Environmental problems like pollution affect human health. Scientists study the brain to understand memory and learning processes. English is widely used in science, business and travel. Technology connects people globally and improves communication speed."},
B1:{grammar:"Past Continuous + Future Simple",
article:"Modern education depends heavily on technology. Students use digital tools to improve learning efficiency. Environmental protection has become a global issue due to climate change. Research on the human brain shows how emotions affect decision-making. English proficiency is essential for international communication and academic success."},
B2:{grammar:"Conditionals + Passive Voice",
article:"Education, environment, technology and neuroscience are interconnected fields shaping modern society. Artificial intelligence is revolutionizing learning systems while environmental degradation threatens global stability. Studies on brain plasticity reveal how humans adapt to new knowledge. English remains the dominant language in academic research and international collaboration."},
C1:{grammar:"Inversion + advanced structures",
article:"The rapid advancement of technology has fundamentally transformed education, environmental awareness, and cognitive science. Human understanding of the brain has expanded significantly, revealing complex neural networks responsible for memory and reasoning. Environmental sustainability now requires interdisciplinary approaches combining science, policy and ethics. English continues to dominate global academic discourse."},
C2:{grammar:"Native-like fluency + academic mastery",
article:"In contemporary academia, the convergence of education, environmental science, artificial intelligence and cognitive neuroscience represents a paradigm shift in human understanding. The brain, as a highly adaptive organ, facilitates complex reasoning processes that underpin language acquisition and analytical thinking. Environmental crises necessitate unprecedented levels of global cooperation, while English functions as the primary medium of scholarly communication across disciplines."}
};

function openLevel(lvl){
let html="<h3>Vocabulary (With Uzbek Translation)</h3>";
vocab(lvl).forEach(v=>{
html+=`<div class='item'><div class='word'>${v.w} - ${v.t}</div><div>${v.e}</div></div>`;
});

html+="<h3>Grammar</h3><div class='item'>"+data[lvl].grammar+"</div>";
html+="<h3>Scientific Article (~200 words)</h3><div class='article'>"+data[lvl].article+"</div>";

html+="<p style='color:#38bdf8;margin-top:10px;'>Education • Environment • Technology • Brain • English Focus</p>";

document.getElementById("modal").style.display="flex";
document.getElementById("title").innerText=lvl+" Level";
document.getElementById("content").innerHTML=html;
}

function closeModal(){document.getElementById("modal").style.display="none";}

</script>

</body>
</html>
